# Builds the site and publishes it to GitHub Pages on every push to main.
# The import and translation steps run on your own computer (npm run update);
# this only builds the already-generated pages, so it needs no Python and no secrets.
# Each action is pinned to an exact commit (a tag like v7 can be moved; a commit can't).
# Dependabot (.github/dependabot.yml) proposes updates once a month.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Link-preview cards for every section: drawn with the runner's Chrome and kept in the
      # Actions cache between builds, so only changed sections are redrawn (free for public repos).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/og/s
          key: og-sections-${{ hashFiles('src/content/sections/**', 'src/content/bg/sections/**', 'scripts/og-sections.mjs') }}
          restore-keys: og-sections-
      - run: npm run og:sections
      - run: npm run build
      # Refuse to publish if any page lacks its Content Security Policy.
      - run: node scripts/csp.mjs --check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          # Publish dist/.well-known/security.txt (dot folders are left out unless asked for).
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
