# Builds the site and publishes it to GitHub Pages on every push to main.
# The import and translation steps run on your own computer (npm run update);
# this only builds the already-generated pages, so it needs no Python and no secrets.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Link-preview cards for every section: drawn with the runner's Chrome and kept in the
      # Actions cache between builds, so only changed sections are redrawn (free for public repos).
      - uses: actions/cache@v6
        with:
          path: public/og/s
          key: og-sections-${{ hashFiles('src/content/sections/**', 'src/content/bg/sections/**', 'scripts/og-sections.mjs') }}
          restore-keys: og-sections-
      - run: npm run og:sections
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
