# Key terms the book defines. Used for term previews, the review system and the connections map.
#
# id          unique, lowercase-with-dashes
# term / bg   the term in English / Bulgarian
# definition  short definition, taken from the chapter's flashcards where possible
# definitionBg  Bulgarian definition (draft: from the site's translation, check it)
# defined     the section where the book defines it ("NNN/section-slug")
# sections    other sections that also explain it (optional)
# related     ids of related concepts (optional)
# link        where the term gets a definition preview in the text: everywhere (default),
#             "chapter" (only in its own chapter, for everyday words like "flow"), or false (never)
# source      where the definition came from
# status      proposed (only shown in a local preview) or approved (shown on the site)

